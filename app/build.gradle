plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tpai.android'
    compileSdk 36

    defaultConfig {
        applicationId 'com.tpai.android'
        minSdk 26
        targetSdk 36
        versionCode 23
        versionName '1.0.23'
    }

    signingConfigs {
        release {
            def path = System.getenv('TPAI_KEYSTORE_PATH')
            def pwd = System.getenv('TPAI_KEYSTORE_PASSWORD')
            if (path != null && pwd != null) {
                storeFile file(path)
                storePassword pwd
                keyAlias 'tpai'
                keyPassword pwd
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
