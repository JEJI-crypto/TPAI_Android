name: Build TPAI Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Set up Gradle 6.7.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '6.7.1'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk TPAI_Android-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TPAI_Android-APK
          path: TPAI_Android-debug.apk
          if-no-files-found: error
