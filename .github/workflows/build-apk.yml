name: TPAI Android APK et AAB
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Installer Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false' 
      - name: Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Installer la cle de signature permanente
        shell: bash
        env:
          TPAI_KEYSTORE_BASE64: ${{ secrets.TPAI_KEYSTORE_BASE64 }}
        run: |
          test -n "$TPAI_KEYSTORE_BASE64"
          printf '%s' "$TPAI_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/tpai-release.jks"
      - name: Verifier automatiquement la version et les sources
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYVERIFY'
          import re
          from pathlib import Path
          gradle = Path('app/build.gradle').read_text(encoding='utf-8')
          src = Path('app/src/main/java/com/tpai/android/MainActivity.java').read_text(encoding='utf-8')
          api = Path('app/src/main/java/com/tpai/android/SupabaseApi.java').read_text(encoding='utf-8')
          workflow = Path('.github/workflows/build-apk.yml').read_text(encoding='utf-8')
          code = re.search(r'(?m)^\s*versionCode\s+(\d+)\s*$', gradle)
          name = re.search(r"""(?m)^\s*versionName\s+['"]([^'"]+)['"]\s*$""", gradle)
          assert code and name, 'Version Gradle introuvable'
          version = f'1.0.{code.group(1)}'
          assert name.group(1) == version, f'Incoherence Gradle: {version} != {name.group(1)}'
          assert version == '1.0.29', f'Version inattendue: {version}'
          marker = f'TPAI_BUILD_V1{code.group(1)}_PC_TRAINING_CASCADE'
          assert marker in src, 'Marqueur Android absent / incoherent'
          assert '"Accept-Profile", "tpai"' in api, 'Profil REST tpai absent'
          assert 'MAX_TRAINING = 10' in src, 'Limite de matches manquante'
          assert 'COMPLETE_OBSERVED' in src and 'COMPLETE_ESTIMATED' in src, 'Filtrage cotes manquant'
          assert 'Côtes estimées incluses' in src, 'Option cotes estimees absente'
          assert 'android-v1.29' in workflow and 'TPAI_Android_V1.29.apk' in workflow, 'Publication V1.29 incoherente'
          print(f'SOURCES VERIFIEES : {version}, code={code.group(1)}, marker={marker}')
          PYVERIFY
      - name: Construire APK et AAB signes
        env:
          TPAI_KEYSTORE_PATH: ${{ runner.temp }}/tpai-release.jks
          TPAI_KEYSTORE_PASSWORD: ${{ secrets.TPAI_KEYSTORE_PASSWORD }}
        run: gradle --no-daemon assembleRelease bundleRelease
      - name: Nommer les sorties
        run: |
          cp app/build/outputs/apk/release/app-release.apk TPAI_Android.apk
          cp TPAI_Android.apk TPAI_Android_V1.29.apk
          cp app/build/outputs/bundle/release/app-release.aab TPAI_Android.aab
      - name: Verifier le contenu REEL de l APK V1.29
        run: |
          python3 - <<'PYBUILD'
          from zipfile import ZipFile
          from pathlib import Path
          apk=Path('TPAI_Android.apk')
          assert apk.is_file() and apk.stat().st_size > 10000, 'APK absent ou anormalement petit'
          with ZipFile(apk) as z:
              dex=b''.join(z.read(n) for n in z.namelist() if n.startswith('classes') and n.endswith('.dex'))
          assert b'TPAI_BUILD_V129_PC_TRAINING_CASCADE' in dex, 'ECHEC: l APK ne contient pas la nouvelle interface V1.29'
          assert b'Accept-Profile' in dex, 'ECHEC: API REST attendue absente'
          print('VERIFIE: APK contient la nouvelle interface et l acces REST tpai')
          PYBUILD
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging TPAI_Android.apk | grep -E "package:|sdkVersion:|targetSdkVersion:"
      - name: Archives GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: TPAI_Android_V1.29
          path: |
            TPAI_Android.apk
            TPAI_Android_V1.29.apk
            TPAI_Android.aab
          if-no-files-found: error
      - name: Publication GitHub APK et AAB
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: TPAI Android - Derniere version
          prerelease: false
          make_latest: true
          files: |
            TPAI_Android.apk
            TPAI_Android_V1.29.apk
            TPAI_Android.aab

      - name: Publication versionnee independante V1.29
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v1.29
          name: TPAI Android V1.29 - Matchs entraînement REST tpai
          prerelease: false
          files: |
            TPAI_Android.apk
            TPAI_Android_V1.29.apk
            TPAI_Android.aab
