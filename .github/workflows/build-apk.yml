name: TPAI Android APK et AAB
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Installer Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false' 
      - name: Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Installer la cle de signature permanente
        shell: bash
        env:
          TPAI_KEYSTORE_BASE64: ${{ secrets.TPAI_KEYSTORE_BASE64 }}
        run: |
          test -n "$TPAI_KEYSTORE_BASE64"
          printf '%s' "$TPAI_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/tpai-release.jks"
      - name: Verifier exactement les sources V1.26
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'TPAI_BUILD_V126_PC_GRID_NATURAL_CLOCKS' app/src/main/java/com/tpai/android/MainActivity.java
          grep -Fq 'versionCode 26' app/build.gradle
          grep -Fq "versionName '1.0.24'" app/build.gradle
          grep -Fq '"Accept-Profile", "tpai"' app/src/main/java/com/tpai/android/SupabaseApi.java
          grep -Fq 'MATCHS D’ENTRAÎNEMENT' app/src/main/java/com/tpai/android/MainActivity.java
          grep -Fq 'MAX_TRAINING = 10' app/src/main/java/com/tpai/android/MainActivity.java
          grep -Fq 'COMPLETE_OBSERVED' app/src/main/java/com/tpai/android/MainActivity.java
          grep -Fq 'live_missing_points' app/src/main/java/com/tpai/android/MainActivity.java
          grep -Fq 'loadObservedHistory' app/src/main/java/com/tpai/android/MainActivity.java
          grep -Fq 'Côtes estimées incluses' app/src/main/java/com/tpai/android/MainActivity.java
          grep -Fq 'COMPLETE_ESTIMATED' app/src/main/java/com/tpai/android/MainActivity.java
          grep -Fq 'filterRevision' app/src/main/java/com/tpai/android/MainActivity.java
          if grep -Fq 'TOUS LES MATCHS' app/src/main/java/com/tpai/android/MainActivity.java; then
            echo 'ERREUR: ancienne interface Tous les matchs'; exit 1
          fi
          echo "Empreinte source MainActivity : $(sha256sum app/src/main/java/com/tpai/android/MainActivity.java)"
      - name: Construire APK et AAB signes
        env:
          TPAI_KEYSTORE_PATH: ${{ runner.temp }}/tpai-release.jks
          TPAI_KEYSTORE_PASSWORD: ${{ secrets.TPAI_KEYSTORE_PASSWORD }}
        run: gradle --no-daemon assembleRelease bundleRelease
      - name: Nommer les sorties
        run: |
          cp app/build/outputs/apk/release/app-release.apk TPAI_Android.apk
          cp TPAI_Android.apk TPAI_Android_V1.26.apk
          cp app/build/outputs/bundle/release/app-release.aab TPAI_Android.aab
      - name: Verifier le contenu REEL de l APK V1.26
        run: |
          python3 - <<'PYBUILD'
          from zipfile import ZipFile
          from pathlib import Path
          apk=Path('TPAI_Android.apk')
          assert apk.is_file() and apk.stat().st_size > 10000, 'APK absent ou anormalement petit'
          with ZipFile(apk) as z:
              dex=b''.join(z.read(n) for n in z.namelist() if n.startswith('classes') and n.endswith('.dex'))
          assert b'TPAI_BUILD_V126_PC_GRID_NATURAL_CLOCKS' in dex, 'ECHEC: l APK ne contient pas la nouvelle interface V1.26'
          assert b'Accept-Profile' in dex, 'ECHEC: API REST attendue absente'
          print('VERIFIE: APK contient la nouvelle interface et l acces REST tpai')
          PYBUILD
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging TPAI_Android.apk | grep -E "package:|sdkVersion:|targetSdkVersion:"
      - name: Archives GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: TPAI_Android_V1.26
          path: |
            TPAI_Android.apk
            TPAI_Android_V1.26.apk
            TPAI_Android.aab
          if-no-files-found: error
      - name: Publication GitHub APK et AAB
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: TPAI Android - Derniere version
          prerelease: false
          make_latest: true
          files: |
            TPAI_Android.apk
            TPAI_Android_V1.26.apk
            TPAI_Android.aab

      - name: Publication versionnee independante V1.26
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v1.26
          name: TPAI Android V1.26 - Matchs entraînement REST tpai
          prerelease: false
          files: |
            TPAI_Android.apk
            TPAI_Android_V1.26.apk
            TPAI_Android.aab
