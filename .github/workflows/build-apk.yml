name: TPAI Android APK et AAB
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Installer Android SDK
        uses: android-actions/setup-android@v3
      - name: Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Installer la cle de signature permanente
        shell: bash
        env:
          TPAI_KEYSTORE_BASE64: ${{ secrets.TPAI_KEYSTORE_BASE64 }}
        run: |
          test -n "$TPAI_KEYSTORE_BASE64"
          printf '%s' "$TPAI_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/tpai-release.jks"
      - name: Construire APK et AAB signes
        env:
          TPAI_KEYSTORE_PATH: ${{ runner.temp }}/tpai-release.jks
          TPAI_KEYSTORE_PASSWORD: ${{ secrets.TPAI_KEYSTORE_PASSWORD }}
        run: gradle --no-daemon assembleRelease bundleRelease
      - name: Nommer les sorties
        run: |
          cp app/build/outputs/apk/release/app-release.apk TPAI_Android.apk
          cp app/build/outputs/bundle/release/app-release.aab TPAI_Android.aab
      - name: Archives GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: TPAI_Android_V1.14
          path: |
            TPAI_Android.apk
            TPAI_Android.aab
          if-no-files-found: error
      - name: Publication GitHub APK et AAB
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: TPAI Android - Derniere version
          prerelease: false
          make_latest: true
          files: |
            TPAI_Android.apk
            TPAI_Android.aab
