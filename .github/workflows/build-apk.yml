name: Build TPAI Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Set up Gradle 6.7.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '6.7.1'

      - name: Restore permanent signing key
        shell: bash
        env:
          TPAI_KEYSTORE_BASE64: ${{ secrets.TPAI_KEYSTORE_BASE64 }}
        run: |
          test -n "$TPAI_KEYSTORE_BASE64"
          printf '%s' "$TPAI_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/tpai-release.jks"

      - name: Build permanently signed APK
        env:
          TPAI_KEYSTORE_PATH: ${{ runner.temp }}/tpai-release.jks
          TPAI_KEYSTORE_PASSWORD: ${{ secrets.TPAI_KEYSTORE_PASSWORD }}
        run: gradle --no-daemon assembleRelease

      - name: Prepare APK
        run: cp app/build/outputs/apk/release/app-release.apk TPAI_Android.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TPAI_Android-APK
          path: TPAI_Android.apk
          if-no-files-found: error

      - name: Publish latest APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: TPAI Android - Dernière version
          prerelease: false
          make_latest: true
          files: TPAI_Android.apk
